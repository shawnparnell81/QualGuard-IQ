# How long browsers may keep each kind of file. The page itself is always checked with the server, so an update shows on the
# next load; the built scripts, styles and logos under /assets have the content in their file names and never change; the
# fixed-name icons (favicon, app icons, /brand PNGs) are kept briefly and then checked again. API responses set their own.
map $uri $qg_cache_control {
  default "";
  "/" "no-cache";
  "/index.html" "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/brand/ "public, max-age=3600, must-revalidate";
  ~^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|site\.webmanifest)$ "public, max-age=3600, must-revalidate";
}

server {
  listen 80;
  client_max_body_size 1100m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control $qg_cache_control always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
  # The app only loads its own scripts; MUI needs inline styles. Files from the API carry their own stricter policy.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  # Strict-Transport-Security is added by the HTTPS front end (deploy/Caddyfile), not here: this server also answers plain
  # http://localhost on the computer running the app.
  # Only the address of whoever connected to this server is passed on, so a browser can't fake its address with its own header.
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /health/ { proxy_pass http://api:8080; }
  location = /site.webmanifest { root /usr/share/nginx/html; default_type application/manifest+json; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
