openapi: 3.1.1
info:
  title: Manufacturing QMS FAI and AQL API
  version: 1.0.0
  description: API contract for First Article Inspection and configurable AQL sampling. AQL plans and values are organization-configured;
    this contract does not embed proprietary sampling tables.
servers:
- url: https://api.example.com/api/v1
  description: Production
- url: https://staging-api.example.com/api/v1
  description: Staging
security:
- bearerAuth: []
tags:
- name: FAI
- name: FAI Characteristics
- name: FAI Workflow
- name: AQL Plans
- name: AQL Inspections
- name: Defects
- name: Integrations
- name: Dashboards
- name: Reports
paths:
  /fai:
    get:
      tags:
      - FAI
      summary: List FAI records
      operationId: listFai
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFAI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - &id001
        name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id002
        name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: search
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        schema:
          type: string
          format: date
    post:
      tags:
      - FAI
      summary: Create FAI record
      operationId: createFai
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FAICreate'
