components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetails:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type:
          - string
          - 'null'
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - title
      - status
      - traceId
    PageMetadata:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
    WorkflowAction:
      type: object
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 4000
        reasonCode:
          type:
          - string
          - 'null'
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        expectedVersion:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - comment
    ApprovalRequest:
      type: object
      properties:
        approvalRole:
          type: string
        approverId:
          type:
          - string
          - 'null'
          format: uuid
        dueAt:
          type:
          - string
          - 'null'
          format: date-time
        comment:
          type:
          - string
          - 'null'
      required:
      - approvalRole
    ApprovalDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - Approved
          - Rejected
          - Returned
        comment:
          type: string
          minLength: 1
        expectedVersion:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - decision
      - comment
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        approvalRole:
          type: string
        approverId:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
          enum:
          - Pending
          - Approved
          - Rejected
          - Returned
          - Canceled
        comment:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - approvalRole
      - status
      - createdAt
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        checksumSha256:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
      required:
      - id
      - fileName
      - contentType
      - sizeBytes
      - createdAt
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actorId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        previousValue: {}
        newValue: {}
        reason:
          type:
          - string
          - 'null'
        correlationId:
          type:
          - string
          - 'null'
      required:
      - id
      - action
