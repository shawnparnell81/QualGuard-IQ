openapi: '3.1.1'
info:
  title: QualGuard IQ API
  description: Manufacturing QMS API. Browser clients use the session cookie (plus the X-CSRF-TOKEN header on writes); API clients may send a bearer token from POST /api/auth/token. AQL plans and values are organization-configured; no proprietary sampling tables are embedded.
  version: 1.0.0
servers:
  - url: http://localhost:5080
paths:
  /api/account/sign-ins:
    get:
      tags:
        - Account
      description: Requires an authenticated user.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SignInHistory'
            application/json:
              schema:
                $ref: '#/components/schemas/SignInHistory'
            text/json:
              schema:
                $ref: '#/components/schemas/SignInHistory'
        '401':
          description: Not signed in
        '403':
          description: Missing permission or outside site scope
  '/api/actions/{id}/complete':
    post:
      tags:
        - Actions
      description: Requires an authenticated user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
        required: true
      responses:
