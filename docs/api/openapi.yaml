components:
  schemas:
    ActionDto:
      required:
        - id
        - number
        - title
        - description
        - actionType
        - assigneeId
        - assigneeName
        - dueDate
        - status
        - requiresVerification
        - completionNotes
        - verificationNotes
        - isOverdue
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        title:
          type: string
        description:
          type:
            - 'null'
            - string
        actionType:
          type: string
        assigneeId:
          type: string
          format: uuid
        assigneeName:
          type: string
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ActionStatus'
        requiresVerification:
          type: boolean
        completionNotes:
          type:
            - 'null'
            - string
        verificationNotes:
          type:
            - 'null'
            - string
        isOverdue:
          type: boolean
        completedById:
          type:
            - 'null'
            - string
          format: uuid
    ActionStatus:
      type: integer
    AddCommentRequest:
      required:
        - body
      type: object
      properties:
        body:
          type: string
    AddLinkRequest:
      required:
        - toType
        - toId
        - linkType
      type: object
      properties:
        toType:
          type: string
        toId:
          type: string
          format: uuid
        linkType:
          type:
            - 'null'
            - string
