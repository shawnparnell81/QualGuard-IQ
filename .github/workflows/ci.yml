name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
# The workflow only reads the code; it can't push, comment or change settings.
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: qgiq, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: qgiq_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]
        options: --health-cmd clamdcheck.sh --health-interval 15s --health-retries 30 --health-start-period 120s
    env:
      QGIQ_CLAMAV: "1"
      QMS_TEST_AZURE: UseDevelopmentStorage=true
      QMS_TEST_S3: http://localhost:9000
      QMS_TEST_S3_KEY: ci_minio
      QMS_TEST_S3_SECRET: ci_minio_secret
      QMS_TEST_DB: Host=localhost;Port=5432;Database=qgiq_test;Username=qgiq;Password=ci_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start MinIO (S3-compatible storage)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ci_minio -e MINIO_ROOT_PASSWORD=ci_minio_secret pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "10.0.x" }
      - name: Start Azurite (local Azure Blob emulator)
        run: docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build
      - run: dotnet list package --vulnerable --include-transitive
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  ui:
    runs-on: ubuntu-latest
    needs: [backend, web]
    # Full browser suite runs only when started by hand (Actions > ci > Run workflow).
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: qgiq, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      E2E_PGPORT: "5432"
      E2E_PGPASSWORD: ci_only
      E2E_S3_KEY: ci_minio
      E2E_S3_SECRET: ci_minio_secret
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start MinIO (S3-compatible storage)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ci_minio -e MINIO_ROOT_PASSWORD=ci_minio_secret pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: dotnet build ../src/QualGuardIQ.Api
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }
