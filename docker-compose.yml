# Local and self-hosted deployment. Copy .env.example to .env and set real secrets first.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: qgiq
      POSTGRES_USER: qgiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qgiq -d qgiq"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    environment:
      ConnectionStrings__Default: Host=postgres;Database=qgiq;Username=qgiq;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Seed__ApplicationName: ${APP_NAME:-QualGuard IQ}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 15s

  worker:
    build: { context: ., dockerfile: deploy/Dockerfile.worker }
    environment:
      ConnectionStrings__Default: Host=postgres;Database=qgiq;Username=qgiq;Password=${POSTGRES_PASSWORD}
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    ports: ["8081:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
