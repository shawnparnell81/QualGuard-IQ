# Production additions for a server that runs QualGuard IQ for other people. Use it together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adds: log size limits on every container, so logs can't fill the disk, and a daily database and key ring backup
# with old backups removed after BACKUP_KEEP_DAYS. Turn on HTTPS with the https profile (see .env.example).

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:-20m}
      max-file: "${LOG_MAX_FILES:-5}"

services:
  postgres: *logging
  clamav: *logging
  minio: *logging
  minio-init: *logging
  migrate: *logging
  api: *logging
  worker: *logging
  web: *logging
  caddy: *logging

  backup-schedule:
    # Daily backup to BACKUP_DIR at BACKUP_TIME (server time zone TIME_ZONE). Copy the folder off the server as well;
    # a backup on the same disk doesn't survive losing the server.
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/backup-schedule.sh", "/backups"]
    <<: *logging
    environment:
      PGHOST: postgres
      PGUSER: qgiq
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: qgiq
      QGIQ_KEYS_DIR: /keys
      TZ: ${TIME_ZONE:-America/New_York}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - dpkeys:/keys:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
